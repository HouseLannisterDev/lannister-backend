[supervisord]
nodaemon=true
user=appuser

[program:gunicorn]
command=gunicorn lannister_news_api.wsgi:application --bind 127.0.0.1:8000 --workers 3 --timeout 300
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/access.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0